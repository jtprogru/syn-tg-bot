# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

set:
  - pipefail

vars:
  HW_DIR: ./hw03

silent: false

tasks:
  venv:
    desc: Create uv environment
    dir: '{{ .HW_DIR }}'
    preconditions:
      - test -f $(which uv)
    cmds:
      - uv sync
    run: once
    internal: true

  run:
    desc: Run HW03
    dir: '{{ .HW_DIR }}'
    preconditions:
      - test -f $(which uv)
    deps:
      - venv
    cmds:
      - uv run python main.py
    dotenv:
      - .env

  dc:up:
    desc: Run docker compose up
    dir: '{{ .HW_DIR }}'
    preconditions:
      - test -f $(which docker)
    cmds:
      - docker compose up -d --build
    dotenv:
      - .env

  dc:down:
    desc: Run docker compose down
    dir: '{{ .HW_DIR }}'
    preconditions:
      - test -f $(which docker)
    cmds:
      - docker compose down
